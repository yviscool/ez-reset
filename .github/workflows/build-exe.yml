name: Build Windows EXE

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .

      - name: Build EXE
        run: pyinstaller ez-reset.spec --clean

      - name: Rename artifact
        shell: pwsh
        run: |
          $artifactName = "ez-reset-${{ github.sha }}-windows-x64.exe"
          Copy-Item -LiteralPath "dist/ez-reset.exe" -Destination "dist/$artifactName" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ez-reset-windows-exe
          path: dist/ez-reset-*-windows-x64.exe
          if-no-files-found: error
