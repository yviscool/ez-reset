name: Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create or update, for example v0.1.1
        required: true
      release_name:
        description: Optional release title
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .

      - name: Build EXE
        run: pyinstaller ez-reset.spec --clean

      - name: Prepare release asset
        id: asset
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag_name }}" }
          $releaseName = if ("${{ github.ref_type }}" -eq "tag") { "ez-reset $tag" } elseif ("${{ github.event.inputs.release_name }}") { "${{ github.event.inputs.release_name }}" } else { "ez-reset $tag" }
          $assetName = "ez-reset-$tag-windows-x64.exe"
          Copy-Item -LiteralPath "dist/ez-reset.exe" -Destination "dist/$assetName" -Force
          "asset_path=dist/$assetName" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset.outputs.release_tag }}
          name: ${{ steps.asset.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.asset.outputs.asset_path }}
          generate_release_notes: true
