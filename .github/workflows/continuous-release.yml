name: Continuous Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continuous-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .

      - name: Build EXE
        run: pyinstaller ez-reset.spec --clean

      - name: Prepare release asset
        id: asset
        shell: pwsh
        run: |
          $assetName = "ez-reset-continuous-windows-x64.exe"
          Copy-Item -LiteralPath "dist/ez-reset.exe" -Destination "dist/$assetName" -Force
          "asset_path=dist/$assetName" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Move continuous tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa continuous -m "Continuous release"
          git push origin refs/tags/continuous --force

      - name: Create or update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: ez-reset continuous
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Automatic rolling release from `master`.

            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: ${{ steps.asset.outputs.asset_path }}
